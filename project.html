<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project</title>
  <link rel="icon" href="images/favicon.png">

  <!-- Bootstrap 5.3.8 (styling) and Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Our own styles (colors come from content/config.md) -->
  <link href="css/style.css" rel="stylesheet">
</head>

<!--
  PROJECT DETAIL PAGE
  Shows one project: project.html?id=<folder name inside /projects>
  The content comes from projects/<folder>/index.md
-->

<body>

  <!-- ========== NAVIGATION ========== -->
  <nav class="navbar navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html" id="site-title">Portfolio</a>
      <a class="nav-link text-light" href="index.html#projects"><i class="bi bi-arrow-left"></i> All projects</a>
    </div>
  </nav>

  <!-- ========== PROJECT HEADER ========== -->
  <header class="hero py-5">
    <div class="container">
      <h1 id="project-title" class="display-6 fw-bold mb-3"></h1>
      <p id="project-summary" class="lead mb-3"></p>
      <div id="project-tags" class="d-flex flex-wrap gap-1"></div>
    </div>
  </header>

  <!-- ========== PROJECT CONTENT ========== -->
  <main class="py-5">
    <div class="container">
      <article id="project-content" class="project-body"></article>
      <a class="btn btn-highlight mt-4" href="index.html#projects"><i class="bi bi-arrow-left"></i> Back to projects</a>
    </div>
  </main>

  <footer class="py-4 text-center small">
    <div class="container" id="footer-text"></div>
  </footer>

  <!-- Libraries: Bootstrap JS, Markdown parser, HTML sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>

  <script src="js/common.js"></script>
  <script src="js/project.js"></script>
</body>

</html>
